name: Release Desktop Connector

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            selfprint-connector/package-lock.json
            selfprint-connector/desktop/package-lock.json

      - name: Install Connector Dependencies & Build Daemon
        working-directory: selfprint-connector
        run: |
          npm ci
          npm run build

      - name: Install Desktop Dependencies & Build Web Bundle
        working-directory: selfprint-connector/desktop
        run: |
          npm ci
          npm run build
          npm run build:electron

      - name: Build and Publish Installer to GitHub Releases
        working-directory: selfprint-connector/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --publish always
